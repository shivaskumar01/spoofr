[project]
name = "spoofr"
version = "1.0.0"
description = "Spoofr — spoof your iPhone's GPS to anywhere on the map (iOS 17–26, no jailbreak)."
requires-python = ">=3.11"
dependencies = [
  "pymobiledevice3>=9,<10",
  "PySide6>=6.7",
  "tkintermapview>=1.29",
  "geocoder>=1.38",
  "customtkinter>=5.2",
  "gpxpy>=1.6",
  "segno>=1.6",
  "requests>=2.28",
  "pyobjc-framework-Cocoa>=10; sys_platform == 'darwin'",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["core", "gui", "macui", "portable", "server"]
packages = ["qtui"]
